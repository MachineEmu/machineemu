[workspace]
members = ["crates/machineemu-core", "crates/machineemu", "crates/machineemu-viewer", "crates/display-stream", "crates/display-stream-protocol"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
bytes = "1"
futures-util = "0.3"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "service"] }
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5.5", features = ["macros"] }
machineemu-core = { path = "crates/machineemu-core" }
nix = { version = "0.29", features = ["socket", "uio", "signal"] }
display-stream-protocol = { path = "crates/display-stream-protocol" }
zbus = { version = "5.19", default-features = false, features = ["p2p", "tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
