name: machineemu

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # machineemu-core's instance-preparation test creates a real qcow2
      # backing file, the same reason the Python job needs these tools.
      - name: Install QEMU image tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # tests/test_machine_state.py builds real qcow2 overlays, so the runner
      # needs qemu-img; without it three tests fail on a missing executable.
      - name: Install QEMU image tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - name: Create test environment
        run: uv venv --python 3.12 .venv
      - name: Install test dependencies and package
        run: |
          uv pip install --python .venv/bin/python '.[api,test]'
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Check OpenAPI contract
        run: PYTHONPATH=python .venv/bin/python scripts/check_openapi.py
      - name: Check release metadata
        run: .venv/bin/python scripts/check_release_set.py release-set.json

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and source archive
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: machineemu-distributions
          path: dist/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Verify generated API types
        working-directory: web
        run: |
          bun run generate:api-types
          git diff --exit-code -- src/api-types.d.ts
      - name: Test and type-check web client
        working-directory: web
        run: |
          bun test
          bun run typecheck
