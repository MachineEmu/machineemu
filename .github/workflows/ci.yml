name: machineemu

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test planner
        run: cargo test --workspace

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create test environment
        run: uv venv --python 3.12 .venv
      - name: Install test dependencies and package
        run: |
          uv pip install --python .venv/bin/python '.[api,test]'
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Check OpenAPI contract
        run: PYTHONPATH=python .venv/bin/python scripts/check_openapi.py
      - name: Check release metadata
        run: .venv/bin/python scripts/check_release_set.py release-set.json

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and source archive
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: machineemu-distributions
          path: dist/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Verify generated API types
        working-directory: web
        run: |
          bun run generate:api-types
          git diff --exit-code -- src/api-types.d.ts
      - name: Test and type-check web client
        working-directory: web
        run: |
          bun test
          bun run typecheck
