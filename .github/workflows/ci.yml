name: machineemu

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create test environment
        run: uv venv --python ${{ matrix.python-version }} .venv
      - name: Install test dependencies and package
        run: |
          uv pip install --python .venv/bin/python '.[api,test]'
      - name: Test
        run: .venv/bin/python -m pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and source archive
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: machineemu-distributions
          path: dist/
