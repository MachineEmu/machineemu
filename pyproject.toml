[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machineemu"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
lab = ["cryptography>=43,<51"]
test = ["pytest>=8", "httpx2>=2"]

[project.scripts]
machineemu = "machineemu.cli:main"
machineemu-api = "machineemu.api_server:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
